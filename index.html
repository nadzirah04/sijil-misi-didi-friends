<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <title>The Shape League</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>The Shape League</h1>

        <div id="user-section">
            <label>Nama Kumpulan / Murid: </label>
            <input type="text" id="username">
            <button onclick="startQuiz()">Mula</button>
        </div>

        <div id="quiz-section" style="display:none;">
            <h2 id="question-title"></h2>
            <input type="text" id="answer" placeholder="Masukkan jawapan">
            <button onclick="submitAnswer()">Hantar</button>
            <p id="feedback"></p>
        </div>

        <div id="leaderboard-section">
            <h2>Leaderboard</h2>
            <ul id="leaderboard"></ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
